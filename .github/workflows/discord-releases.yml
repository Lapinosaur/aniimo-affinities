name: Discord release announcements
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to announce (posts one message)
        required: true
        type: string
      message_id:
        description: Optional existing bot message ID to update instead of posting again
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: discord-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check announcement rules
        run: python3 -m unittest discover -s scripts -p "test_discord_release.py"
      - name: Publish release card
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: python3 scripts/discord_release.py
