name: Publish stable release
on:
  workflow_dispatch:
    inputs:
      announce_discord:
        description: Announce this release on Discord
        required: true
        default: true
        type: boolean
permissions:
  contents: write
  actions: write
concurrency:
  group: publish-stable
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: npm run format:check
      - run: npm run check
      - run: python -m unittest discover -s scripts -p "test_*.py"
      # Insert the approved signing provider here, before validation and hashing.
      - name: Verify release signing status
        shell: pwsh
        env:
          REQUIRE_CODE_SIGNATURE: ${{ vars.REQUIRE_CODE_SIGNATURE }}
        run: ./scripts/verify-signature.ps1 -RequireSigned:($env:REQUIRE_CODE_SIGNATURE -eq 'true')
      - name: Publish tested executable and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ANNOUNCE_DISCORD: ${{ inputs.announce_discord }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $notes = "docs/releases/$tag.md"
          if (!(Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          $hash = (Get-FileHash dist/Affinisaur.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          # Keep an identical legacy asset for clients released before the rename.
          Copy-Item dist/Affinisaur.exe dist/AniimoAffinities.exe
          Set-Content dist/SHA256SUMS.txt @("$hash  Affinisaur.exe", "$hash  AniimoAffinities.exe") -Encoding ascii
          gh release create $tag dist/Affinisaur.exe dist/AniimoAffinities.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Affinisaur $tag" --notes-file $notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft. Existing releases are never overwritten.' }
          gh release edit $tag --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
          # Releases created by GITHUB_TOKEN do not trigger release workflows.
          if ($env:ANNOUNCE_DISCORD -eq 'true') {
            gh workflow run discord-releases.yml -f "tag=$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Release published, but Discord dispatch failed. Retry only the announcement workflow.' }
          } else {
            Write-Output 'Discord announcement disabled for this release.'
          }
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation
          path: |
            dist/tests.txt
            dist/tests.json
            dist/test-results/
          if-no-files-found: warn
